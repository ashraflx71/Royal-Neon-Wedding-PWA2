<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف ملكية فسفورية</title>
    
    <!-- الكود الثاني (التنسيق والألوان) يوضع هنا -->
    <style>
        :root {
            --neon-green: #39FF14; 
            --cyber-gold: #FFD700;
            --dark-bg: #050505; 
            --neon-shadow: 0 0 10px #39FF14, 0 0 20px #39FF14;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 450px;
            padding: 30px;
            border: 1px solid var(--neon-green);
            box-shadow: var(--neon-shadow);
            background: rgba(0, 0, 0, 0.9);
            border-radius: 20px;
            text-align: center;
        }

        h1 {
            color: var(--cyber-gold);
            text-shadow: 0 0 15px var(--cyber-gold);
            font-size: 32px;
        }

        .names {
            font-size: 32px;
            color: var(--neon-green);
            text-shadow: var(--neon-shadow);
            padding: 20px 0;
            margin: 20px 0;
            border-top: 1px dashed var(--neon-green);
            border-bottom: 1px dashed var(--neon-green);
        }

        p {
            font-size: 22px; /* الحجم المفضل لديك للقراءة */
            color: #f0f0f0;
        }

        .btn {
            display: block;
            margin: 15px auto;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: inset 0 0 5px var(--neon-green);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>دعوة زفاف ملكية</h1>
        
        <div class="names">
            أحمد & سارة
        </div>

        <p>يتشرفون بدعوتكم لحفل الزفاف</p>
        <p>التاريخ: 25 يونيو 2026</p>
        
        <a href="#" class="btn">📍 موقع القاعة (GPS)</a>
        <a href="#" class="btn" style="border-color: var(--cyber-gold); color: var(--cyber-gold); box-shadow: inset 0 0 5px var(--cyber-gold);">✅ تأكيد الحضور</a>
    </div>

</body>
</html>
