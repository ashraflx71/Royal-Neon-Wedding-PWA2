<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Neon Invitation | Creative 2026</title>
    <style>
        :root {
            --neon-blue: #00F3FF;      /* لون الكلام */
            --neon-orange: #FF6600;    /* لون الإطار */
            --dark-bg: #050505;
        }

        body { background-color: var(--dark-bg); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .card {
            width: 90%; max-width: 420px;
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(15px);
            border: 2px solid var(--neon-orange); /* إطار برتقالي */
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.3);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
        }

        h1 { color: var(--neon-orange); }
        .names { font-size: 38px; font-weight: bold; margin: 20px 0; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .details { font-size: 22px; line-height: 2; margin-bottom: 25px; color: var(--neon-blue); }
        
        .btn { display: block; padding: 15px; margin: 15px 0; border-radius: 15px; text-decoration: none; font-weight: bold; border: 2px solid var(--neon-blue); color: var(--neon-blue); }
        
        #adminPanel { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; padding: 30px; z-index: 999; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #111; border: 1px solid var(--neon-orange); color: #fff; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>دعوة زفاف</h1>
        <div class="names" id="displayNames">أحمد & سارة</div>
        <div class="details">
            📅 <span id="dateText">2026-06-25</span> <br> 
            📍 <span id="hallText">قاعة الأفراح</span>
        </div>
        <a href="#" class="btn">📍 موقع القاعة (GPS)</a>
    </div>

    <div onclick="document.getElementById('adminPanel').style.display='block'" style="position:fixed; bottom:20px; right:20px; cursor:pointer; color:var(--neon-orange);">⚙️ إعدادات</div>

    <div id="adminPanel">
        <h2 style="color:var(--neon-orange)">تعديل بيانات القاعة</h2>
        <input type="text" id="nameInput" placeholder="أسماء العروسين">
        <input type="date" id="dateInput">
        <!-- حقل نصي حر لكتابة أي قاعة في مصر -->
        <input type="text" id="hallInput" placeholder="اسم القاعة (مثلاً: قاعة السلام - القاهرة)">
        
        <button onclick="updateData()" style="width:100%; padding:15px; background:var(--neon-orange); border:none; border-radius:10px; font-weight:bold; color:white;">حفظ التغييرات</button>
    </div>

    <script>
        function updateData() {
            document.getElementById('displayNames').innerText = document.getElementById('nameInput').value || 'أحمد & سارة';
            document.getElementById('dateText').innerText = document.getElementById('dateInput').value || '2026-06-25';
            document.getElementById('hallText').innerText = document.getElementById('hallInput').value || 'قاعة الأفراح';
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
