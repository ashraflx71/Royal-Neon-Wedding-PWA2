<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Neon Invitation | Creative 2026</title>
    <style>
        :root {
            --neon-green: #39FF14;    /* أخضر فسفوري صارخ */
            --neon-blue: #00F3FF;     /* أزرق فسفوري مضيء */
            --dark-bg: #050505;       /* خلفية سوداء عميقة */
        }

        body { 
            background-color: var(--dark-bg); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; 
        }
        
        .card {
            width: 85%; max-width: 400px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            /* إطار أخضر فسفوري رفيع ومشّع */
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green), inset 0 0 5px var(--neon-green);
            border-radius: 25px;
            padding: 50px 30px;
            text-align: center;
        }

        h1 { 
            color: var(--neon-green); 
            font-size: 22px; 
            font-weight: 300; 
            letter-spacing: 4px; 
            margin-bottom: 20px;
        }

        .names { 
            font-size: 38px; 
            font-weight: bold; 
            margin: 25px 0; 
            color: var(--neon-blue); 
            text-shadow: 0 0 15px var(--neon-blue); 
        }

        .details { 
            font-size: 22px; 
            line-height: 2.2; 
            margin-bottom: 30px; 
            color: var(--neon-blue); 
        }
        
        .btn { 
            display: block; 
            padding: 15px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: bold; 
            border: 2px solid var(--neon-blue); 
            color: var(--neon-blue); 
            box-shadow: 0 0 10px var(--neon-blue);
            transition: 0.3s;
        }

        /* لوحة التحكم */
        #adminPanel { 
            display:none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(0,0,0,0.95); padding: 30px; z-index: 999; box-sizing: border-box; 
        }
        input { 
            width: 100%; padding: 15px; margin: 10px 0; background: #111; 
            border: 1px solid var(--neon-green); color: #fff; border-radius: 8px; 
        }
        .save-btn { 
            width: 100%; padding: 15px; background: var(--neon-green); 
            border: none; color: black; font-weight: bold; cursor: pointer; 
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>دعوة زفاف</h1>
        <div class="names" id="displayNames">أحمد & سارة</div>
        <div class="details">
            📅 <span id="dateText">2026-06-25</span> <br> 
            📍 <span id="hallText">قاعة الأفراح</span>
        </div>
        <a href="#" class="btn">📍 موقع القاعة (GPS)</a>
    </div>

    <!-- زر الإعدادات -->
    <div onclick="document.getElementById('adminPanel').style.display='block'" 
         style="position:fixed; bottom:20px; right:20px; cursor:pointer; color:var(--neon-green); font-size: 24px; opacity: 0.5;">⚙️</div>

    <div id="adminPanel">
        <h2 style="color:var(--neon-green)">تعديل البيانات</h2>
        <input type="text" id="nameInput" placeholder="أسماء العروسين">
        <input type="date" id="dateInput">
        <input type="text" id="hallInput" placeholder="اسم القاعة">
        <button class="save-btn" onclick="updateData()">حفظ التغييرات</button>
        <button onclick="document.getElementById('adminPanel').style.display='none'" 
                style="width:100%; background:transparent; color:red; border:none; margin-top:15px; cursor:pointer;">إلغاء</button>
    </div>

    <script>
        function updateData() {
            const name = document.getElementById('nameInput').value;
            const date = document.getElementById('dateInput').value;
            const hall = document.getElementById('hallInput').value;
            if(name) document.getElementById('displayNames').innerText = name;
            if(date) document.getElementById('dateText').innerText = date;
            if(hall) document.getElementById('hallText').innerText = hall;
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
