<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Neon Invitation | Creative 2026</title>
    <style>
        /* نظام الألوان المتغير */
        :root {
            --neon-color: #00F3FF;      /* اللون الأساسي للنصوص */
            --frame-color: #FFD700;     /* لون الإطار */
            --dark-bg: #050505;
        }

        body { 
            background-color: var(--dark-bg); 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        
        .card {
            width: 90%; 
            max-width: 420px;
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(15px);
            border: 3px solid var(--frame-color) !important;
            box-shadow: 0 0 20px var(--frame-color), inset 0 0 10px var(--frame-color) !important;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            transition: 0.5s all ease; /* لتغيير الألوان بنعومة */
        }

        h1 { color: var(--frame-color) !important; font-size: 24px; }
        
        .names { 
            font-size: 38px; 
            font-weight: bold; 
            margin: 20px 0; 
            color: var(--neon-color) !important; 
            text-shadow: 0 0 15px var(--neon-color) !important; 
        }
        
        .details { 
            font-size: 22px; 
            line-height: 2; 
            margin-bottom: 25px; 
            color: var(--neon-color) !important; 
        }
        
        .btn { 
            display: block; 
            padding: 15px; 
            margin: 15px 0; 
            border-radius: 15px; 
            text-decoration: none; 
            font-weight: bold; 
            border: 2px solid var(--neon-color) !important; 
            color: var(--neon-color) !important; 
            transition: 0.3s;
        }

        #adminPanel { 
            display:none; 
            position: fixed; 
            top:0; left:0; width:100%; height:100%; 
            background: rgba(0,0,0,0.95); 
            padding: 30px; 
            z-index: 999; 
            box-sizing: border-box;
            overflow-y: auto;
        }
        
        input, select { 
            width: 100%; padding: 15px; margin: 10px 0; 
            background: #111; 
            border: 2px solid var(--frame-color) !important; 
            color: #fff; border-radius: 10px; 
            box-sizing: border-box;
        }

        .save-btn {
            width: 100%; padding: 15px; 
            background: var(--frame-color); 
            border: none; border-radius: 10px; 
            font-weight: bold; color: black; 
            cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>دعوة زفاف ملكية</h1>
        <div class="names" id="displayNames">أحمد & سارة</div>
        <div class="details">
            📅 <span id="dateText">2026-06-25</span> <br> 
            📍 <span id="hallText">قاعة الأفراح الملكية</span>
        </div>
        <a href="#" class="btn">📍 موقع القاعة (GPS)</a>
    </div>

    <!-- زر الترس للتحكم -->
    <div onclick="document.getElementById('adminPanel').style.display='block'" 
         style="position:fixed; bottom:20px; right:20px; cursor:pointer; color:var(--frame-color); font-size: 30px; background: rgba(255,255,255,0.1); border-radius: 50%; padding: 10px;">
         ⚙️
    </div>

    <!-- لوحة التحكم المطورة -->
    <div id="adminPanel">
        <h2 style="color:var(--frame-color)">إعدادات الدعوة</h2>
        
        <input type="text" id="nameInput" placeholder="أسماء العروسين">
        <input type="text" id="hallInput" placeholder="اسم القاعة">
        <input type="date" id="dateInput">

        <label style="color:var(--frame-color); display:block; margin-top:15px;">اختر طابع الألوان (Themes):</label>
        <select id="themeSelect">
            <option value="gold-blue">ذهبي وأزرق (الملكي الحالي)</option>
            <option value="orange-cyan">برتقالي وسماوي (جريء)</option>
            <option value="pink-white">وردي وأبيض (رومانسي)</option>
            <option value="green-gold">أخضر نيون وذهبي (عصري)</option>
            <option value="purple-pink">بنفسجي ووردي (فخم)</option>
        </select>
        
        <button class="save-btn" onclick="updateData()">حفظ وتطبيق</button>
        <button onclick="document.getElementById('adminPanel').style.display='none'" style="width:100%; background:transparent; color:red; border:none; margin-top:15px; cursor:pointer;">إلغاء</button>
    </div>

    <script>
        function updateData() {
            // 1. تحديث النصوص
            const name = document.getElementById('nameInput').value;
            const hall = document.getElementById('hallInput').value;
            const date = document.getElementById('dateInput').value;

            if(name) document.getElementById('displayNames').innerText = name;
            if(hall) document.getElementById('hallText').innerText = hall;
            if(date) document.getElementById('dateText').innerText = date;

            // 2. تحديث الألوان حسب الثيم المختارة
            const theme = document.getElementById('themeSelect').value;
            const root = document.documentElement;

            const themes = {
                'gold-blue': { neon: '#00F3FF', frame: '#FFD700' },
                'orange-cyan': { neon: '#00FFFF', frame: '#FF6600' },
                'pink-white': { neon: '#FFFFFF', frame: '#FF1493' },
                'green-gold': { neon: '#39FF14', frame: '#FFD700' },
                'purple-pink': { neon: '#FF00FF', frame: '#8A2BE2' }
            };

            root.style.setProperty('--neon-color', themes[theme].neon);
            root.style.setProperty('--frame-color', themes[theme].frame);

            // إغلاق اللوحة
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
