<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف أنيقة</title>
    <style>
        :root {
            /* ألوان فاتحة جداً ومضيئة */
            --accent-blue: #00d2ff;     /* أزرق سماوي فاتح */
            --lemon-yellow: #faff00;    /* أصفر ليموني مشرق */
            --light-bg: #f8f9fa;        /* خلفية بيضاء فاتحة جداً */
        }

        body { 
            background-color: var(--light-bg); 
            color: #333; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; 
        }
        
        .card {
            width: 90%; max-width: 400px;
            background: #ffffff;
            /* إطار أصفر ليموني فاتح */
            border: 4px solid var(--lemon-yellow);
            border-radius: 40px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        h1 { color: #555; font-size: 22px; margin-bottom: 20px; }
        .names { font-size: 38px; font-weight: bold; margin: 20px 0; color: var(--accent-blue); }
        .details { font-size: 20px; line-height: 2; margin-bottom: 30px; color: #666; }
        
        .btn { 
            display: block; padding: 15px; border-radius: 12px; 
            text-decoration: none; font-weight: bold; 
            background-color: var(--accent-blue); color: white; 
            transition: 0.3s;
        }

        #adminPanel { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: #ffffff; padding: 30px; z-index: 999; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 15px; background: var(--lemon-yellow); border: none; border-radius: 10px; font-weight: bold; color: #333; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h1>دعوة زفاف</h1>
        <div class="names" id="displayNames">أحمد & سارة</div>
        <div class="details">
            📅 <span id="dateText">2026-06-25</span> <br> 
            📍 <span id="hallText">قاعة الفرح</span>
        </div>
        <a href="#" class="btn">📍 موقع القاعة (GPS)</a>
    </div>

    <div onclick="document.getElementById('adminPanel').style.display='block'" style="position:fixed; bottom:20px; right:20px; cursor:pointer; color:#999;">⚙️</div>

    <div id="adminPanel">
        <h2 style="color:#555">تعديل البيانات</h2>
        <input type="text" id="nameInput" placeholder="أسماء العروسين">
        <input type="date" id="dateInput">
        <input type="text" id="hallInput" placeholder="اسم القاعة">
        <button class="save-btn" onclick="updateData()">حفظ التعديلات</button>
    </div>

    <script>
        function updateData() {
            const name = document.getElementById('nameInput').value;
            const date = document.getElementById('dateInput').value;
            const hall = document.getElementById('hallInput').value;
            if(name) document.getElementById('displayNames').innerText = name;
            if(date) document.getElementById('dateText').innerText = date;
            if(hall) document.getElementById('hallText').innerText = hall;
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
