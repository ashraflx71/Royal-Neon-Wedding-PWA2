<script>
    function updateData() {
        // تحديث البيانات النصية
        const name = document.getElementById('nameInput').value;
        const date = document.getElementById('dateInput').value;
        const hall = document.getElementById('hallInput').value;
        
        // تحديث الألوان حسب اختيار العميل
        const theme = document.getElementById('themeInput').value;
        const root = document.documentElement.style;

        if(theme === 'gold-blue') {
            root.setProperty('--neon-blue', '#00F3FF');
            root.setProperty('--royal-gold', '#FFD700');
        } else if(theme === 'pink-white') {
            root.setProperty('--neon-blue', '#FF00FF');
            root.setProperty('--royal-gold', '#FFFFFF');
        } else if(theme === 'green-gold') {
            root.setProperty('--neon-blue', '#39FF14');
            root.setProperty('--royal-gold', '#FFD700');
        }

        if(name) document.getElementById('displayNames').innerText = name;
        if(date) document.getElementById('dateText').innerText = date;
        if(hall) document.getElementById('hallText').innerText = hall;

        document.getElementById('adminPanel').style.display = 'none';
    }
</script>
