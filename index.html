<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف فاخرة | Creative 2026</title>
    <style>
        :root {
            --deep-blue: #1a2a6c;    /* أزرق غامق ملكي */
            --gold-line: #c5a059;    /* ذهبي كلاسيكي */
            --lemon-glow: #faff00;   /* أصفر ليموني فاتح جداً */
            --bg-color: #fcfcfc;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--deep-blue); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; 
        }
        
        .card {
            width: 85%; max-width: 400px;
            background: #ffffff;
            /* الإطار الليموني الخارجي الرفيع جداً */
            border: 1px solid var(--lemon-glow);
            border-radius: 10px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.03);
            position: relative;
        }

        /* الإطار الذهبي الداخلي الرفيع جداً */
        .card::after {
            content: "";
            position: absolute;
            top: 10px; left: 10px; right: 10px; bottom: 10px;
            border: 1px solid var(--gold-line);
            border-radius: 5px;
            pointer-events: none;
        }

        h1 { color: var(--gold-line); font-size: 16px; font-weight: 300; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 10px; }
        .names { font-size: 34px; font-weight: bold; margin: 20px 0; color: var(--deep-blue); }
        .details { font-size: 19px; line-height: 2.2; margin-bottom: 25px; color: #444; }
        
        .btn { 
            display: block; padding: 12px; border: 1.5px solid var(--deep-blue);
            text-decoration: none; font-weight: bold; font-size: 15px;
            color: var(--deep-blue); transition: 0.3s; width: 70%; margin: 0 auto;
            position: relative; z-index: 2;
        }

        #adminPanel { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: #fff; padding: 30px; z-index: 999; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 15px; background: var(--deep-blue); border: none; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Wedding Invitation</h1>
        <div class="names" id="displayNames">أحمد & سارة</div>
        <div class="details">
            📅 <span id="dateText">2026-06-25</span> <br> 
            📍 <span id="hallText">قاعة الأفراح</span>
        </div>
        <a href="#" class="btn">📍 موقع القاعة</a>
    </div>

    <!-- زر الإعدادات الهادئ -->
    <div onclick="document.getElementById('adminPanel').style.display='block'" style="position:fixed; bottom:20px; right:20px; cursor:pointer; color:#ddd; font-size: 20px;">⚙️</div>

    <div id="adminPanel">
        <h2 style="color:var(--deep-blue)">تعديل البيانات</h2>
        <input type="text" id="nameInput" placeholder="أسماء العروسين">
        <input type="date" id="dateInput">
        <input type="text" id="hallInput" placeholder="اسم القاعة">
        <button class="save-btn" onclick="updateData()">حفظ البيانات</button>
        <button onclick="document.getElementById('adminPanel').style.display='none'" style="width:100%; background:transparent; color:red; border:none; margin-top:15px; cursor:pointer;">إلغاء</button>
    </div>

    <script>
        function updateData() {
            const name = document.getElementById('nameInput').value;
            const date = document.getElementById('dateInput').value;
            const hall = document.getElementById('hallInput').value;
            if(name) document.getElementById('displayNames').innerText = name;
            if(date) document.getElementById('dateText').innerText = date;
            if(hall) document.getElementById('hallText').innerText = hall;
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
