<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Neon Wedding | Creative 2026</title>
    <style>
        :root {
            --neon-green: #39FF14;
            --neon-blue: #00F3FF;
            --neon-pink: #FF00FF;
            --cyber-gold: #FFD700;
            --dark-bg: #050505;
        }

        body { background-color: var(--dark-bg); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .card {
            width: 90%; max-width: 420px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            border: 2px solid var(--neon-green);
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
        }

        .names { font-size: 38px; font-weight: bold; margin: 20px 0; color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); }
        .details { font-size: 22px; line-height: 2; margin-bottom: 25px; color: #fff; }
        
        .btn { display: block; padding: 15px; margin: 10px 0; border-radius: 15px; text-decoration: none; font-weight: bold; border: 2px solid; }
        .btn-green { border-color: var(--neon-green); color: var(--neon-green); }
        .btn-blue { border-color: var(--neon-blue); color: var(--neon-blue); }

        #adminPanel { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; padding: 30px; z-index: 999; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; background: #111; border: 1px solid var(--neon-pink); color: #fff; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>دعوة زفاف</h1>
        <div class="names" id="displayNames">أحمد & سارة</div>
        <div class="details" id="displayDate">
            📅 <span id="dateText">2026-06-25</span> <br> 
            📍 <span id="hallText">فندق الفورسيزونز</span>
        </div>
        <a href="#" class="btn btn-green">📍 موقع القاعة (GPS)</a>
        <a href="#" class="btn btn-blue">✅ تأكيد الحضور</a>
    </div>

    <div onclick="document.getElementById('adminPanel').style.display='block'" style="position:fixed; bottom:20px; right:20px; cursor:pointer; color:var(--neon-pink);">⚙️ تعديل البيانات</div>

    <div id="adminPanel">
        <h2 style="color:var(--cyber-gold)">إعدادات الدعوة</h2>
        <input type="text" id="nameInput" placeholder="أسماء العروسين">
        <input type="date" id="dateInput">
        <select id="hallInput">
            <option value="فندق الفورسيزونز">فندق الفورسيزونز</option>
            <option value="قاعة ليلتي">قاعة ليلتي</option>
            <option value="قاعة فندق الهيلتون">قاعة فندق الهيلتون</option>
            <option value="قاعة الماسة الملكية">قاعة الماسة الملكية</option>
        </select>
        <button onclick="updateData()" style="width:100%; padding:15px; background:var(--neon-green); border:none; border-radius:10px; font-weight:bold;">حفظ التغييرات</button>
    </div>

    <script>
        function updateData() {
            document.getElementById('displayNames').innerText = document.getElementById('nameInput').value || 'أحمد & سارة';
            document.getElementById('dateText').innerText = document.getElementById('dateInput').value || '2026-06-25';
            document.getElementById('hallText').innerText = document.getElementById('hallInput').value;
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
