<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف فاخرة</title>
    <style>
        :root {
            --deep-blue: #1a2a6c;    /* أزرق غامق (نص) */
            --gold-line: #c5a059;    /* ذهبي هادئ (إطار) */
            --bg-color: #fdfdfd;     /* أبيض دافئ */
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--deep-blue); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; 
        }
        
        .card {
            width: 90%; max-width: 420px;
            background: #ffffff;
            /* إطار ذهبي رفيع جداً */
            border: 1px solid var(--gold-line);
            border-radius: 5px; /* حواف حادة قليلاً لإعطاء طابع كلاسيكي */
            padding: 60px 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            /* إضافة حاشية داخلية بسيطة لزيادة الفخامة */
            outline: 10px solid #ffffff;
            outline-offset: -15px;
        }

        h1 { color: var(--gold-line); font-size: 18px; font-weight: 300; letter-spacing: 6px; text-transform: uppercase; }
        .names { font-size: 32px; font-weight: 600; margin: 25px 0; color: var(--deep-blue); }
        .details { font-size: 17px; line-height: 2.2; margin-bottom: 30px; color: #444; }
        
        .btn { 
            display: block; padding: 12px; border: 1px solid var(--deep-blue);
            text-decoration: none; font-weight: 400; font-size: 14px;
            color: var(--deep-blue); transition: 0.3s; width: 60%; margin: 0 auto;
        }

        #adminPanel { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: #fff; padding: 30px; z-index: 999; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 0; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 12px; background: var(--deep-blue); border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Wedding Invitation</h1>
        <div class="names" id="displayNames">أحمد & سارة</div>
        <div class="details">
            📅 <span id="dateText">2026-06-25</span> <br> 
            📍 <span id="hallText">قاعة الأفراح</span>
        </div>
        <a href="#" class="btn">موقع القاعة</a>
    </div>

    <div onclick="document.getElementById('adminPanel').style.display='block'" style="position:fixed; bottom:20px; right:20px; cursor:pointer; color:#ccc;">⚙️</div>

    <div id="adminPanel">
        <h2 style="color:var(--deep-blue)">تعديل البيانات</h2>
        <input type="text" id="nameInput" placeholder="أسماء العروسين">
        <input type="date" id="dateInput">
        <input type="text" id="hallInput" placeholder="اسم القاعة">
        <button class="save-btn" onclick="updateData()">حفظ</button>
    </div>

    <script>
        function updateData() {
            const name = document.getElementById('nameInput').value;
            const date = document.getElementById('dateInput').value;
            const hall = document.getElementById('hallInput').value;
            if(name) document.getElementById('displayNames').innerText = name;
            if(date) document.getElementById('dateText').innerText = date;
            if(hall) document.getElementById('hallText').innerText = hall;
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
