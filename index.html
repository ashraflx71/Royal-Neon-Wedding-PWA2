<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف رسمية</title>
    <style>
        :root {
            --deep-blue: #1a2a6c;    /* أزرق غامق (نص) */
            --off-white: #e0e0e0;    /* أبيض غامق (إطار) */
            --bg-color: #fcfcfc;     /* خلفية هادئة */
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--deep-blue); 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; 
        }
        
        .card {
            width: 90%; max-width: 420px;
            background: #ffffff;
            /* إطار أبيض غامق (رمادي فاتح) */
            border: 8px solid var(--off-white);
            border-radius: 15px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 { color: var(--deep-blue); font-size: 20px; text-transform: uppercase; letter-spacing: 3px; font-weight: 300; }
        .names { font-size: 34px; font-weight: bold; margin: 25px 0; color: var(--deep-blue); }
        .details { font-size: 18px; line-height: 2.2; margin-bottom: 30px; color: #444; }
        
        .btn { 
            display: block; padding: 15px; border: 1px solid var(--deep-blue);
            text-decoration: none; font-weight: bold; 
            color: var(--deep-blue); transition: 0.3s;
        }

        #adminPanel { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: #fff; padding: 30px; z-index: 999; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .save-btn { width: 100%; padding: 15px; background: var(--deep-blue); border: none; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Wedding</h1>
        <div class="names" id="displayNames">أحمد & سارة</div>
        <div class="details">
            📅 <span id="dateText">2026-06-25</span> <br> 
            📍 <span id="hallText">قاعة الأفراح</span>
        </div>
        <a href="#" class="btn">📍 موقع القاعة (GPS)</a>
    </div>

    <!-- زر الإعدادات -->
    <div onclick="document.getElementById('adminPanel').style.display='block'" style="position:fixed; bottom:20px; right:20px; cursor:pointer; color:#999;">⚙️</div>

    <div id="adminPanel">
        <h2 style="color:var(--deep-blue)">تعديل البيانات</h2>
        <input type="text" id="nameInput" placeholder="أسماء العروسين">
        <input type="date" id="dateInput">
        <input type="text" id="hallInput" placeholder="اسم القاعة">
        <button class="save-btn" onclick="updateData()">حفظ</button>
    </div>

    <script>
        function updateData() {
            const name = document.getElementById('nameInput').value;
            const date = document.getElementById('dateInput').value;
            const hall = document.getElementById('hallInput').value;
            if(name) document.getElementById('displayNames').innerText = name;
            if(date) document.getElementById('dateText').innerText = date;
            if(hall) document.getElementById('hallText').innerText = hall;
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
