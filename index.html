<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف فاخرة</title>
    <style>
        :root {
            /* ألوان فاتحة جداً وشفافة */
            --soft-blue: #a0d8ef;   /* أزرق فاتح جداً (شعرة لون) */
            --soft-gold: #f4e4a1;   /* ذهبي باهت (شعرة لون) */
            --bg-white: #fafafa;    /* أبيض كريمي هادئ */
        }

        body { 
            background-color: var(--bg-white); 
            color: #333; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; 
        }
        
        .card {
            width: 90%; max-width: 420px;
            background: #ffffff;
            /* ظل خفيف جداً يوحي بالرقي */
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
        }

        h1 { color: #888; font-size: 20px; font-weight: 300; letter-spacing: 5px; text-transform: uppercase; }
        .names { font-size: 36px; font-weight: 600; margin: 30px 0; color: var(--soft-blue); }
        .details { font-size: 18px; line-height: 2.5; margin-bottom: 30px; color: #666; }
        
        .btn { 
            display: block; padding: 15px; border-radius: 10px; 
            text-decoration: none; font-weight: 400; 
            border: 1px solid var(--soft-gold); 
            color: #777; transition: 0.3s;
        }

        #adminPanel { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.95); padding: 30px; z-index: 999; }
        input { width: 100%; padding: 15px; margin: 10px 0; background: #f9f9f9; border: 1px solid #eee; border-radius: 10px; }
        .save-btn { width: 100%; padding: 15px; background: var(--soft-blue); border: none; border-radius: 10px; color: white; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Wedding Invitation</h1>
        <div class="names" id="displayNames">أحمد & سارة</div>
        <div class="details">
            📅 <span id="dateText">2026-06-25</span> <br> 
            📍 <span id="hallText">قاعة الأفراح</span>
        </div>
        <a href="#" class="btn">📍 موقع القاعة</a>
    </div>

    <!-- زر التعديل بشكل أنيق ومخفي -->
    <div onclick="document.getElementById('adminPanel').style.display='block'" style="position:fixed; bottom:20px; right:20px; cursor:pointer; color:#ccc;">⚙️</div>

    <div id="adminPanel">
        <h2 style="color:#555">تعديل البيانات</h2>
        <input type="text" id="nameInput" placeholder="أسماء العروسين">
        <input type="date" id="dateInput">
        <input type="text" id="hallInput" placeholder="اسم القاعة">
        <button class="save-btn" onclick="updateData()">حفظ</button>
    </div>

    <script>
        function updateData() {
            const name = document.getElementById('nameInput').value;
            const date = document.getElementById('dateInput').value;
            const hall = document.getElementById('hallInput').value;
            if(name) document.getElementById('displayNames').innerText = name;
            if(date) document.getElementById('dateText').innerText = date;
            if(hall) document.getElementById('hallText').innerText = hall;
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
