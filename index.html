<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف ملكية</title>
    <style>
        :root {
            /* درجات فاتحة ومضيئة جداً */
            --neon-blue: #00FFFF;      /* أزرق سماوي فاتح جداً */
            --royal-gold: #FFF000;    /* أصفر ليموني مضيء */
            --dark-bg: #050505;
        }

        body { background-color: var(--dark-bg); color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .card {
            width: 90%; max-width: 420px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(20px);
            /* إطار مضيء وفاتح */
            border: 4px solid var(--royal-gold);
            box-shadow: 0 0 40px var(--royal-gold);
            border-radius: 40px;
            padding: 50px 30px;
            text-align: center;
        }

        h1 { color: var(--royal-gold); font-size: 28px; text-transform: uppercase; letter-spacing: 2px; }
        .names { font-size: 42px; font-weight: 900; margin: 25px 0; color: var(--neon-blue); text-shadow: 0 0 25px var(--neon-blue); }
        .details { font-size: 24px; line-height: 2; margin-bottom: 30px; color: var(--neon-blue); font-weight: bold; }
        
        .btn { display: block; padding: 20px; margin: 20px 0; border-radius: 20px; text-decoration: none; font-weight: bold; border: 3px solid var(--neon-blue); color: var(--neon-blue); font-size: 20px; transition: 0.3s; }
        
        #adminPanel { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; padding: 30px; z-index: 999; box-sizing: border-box; }
        input { width: 100%; padding: 18px; margin: 12px 0; background: #151515; border: 2px solid var(--royal-gold); color: #fff; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        .save-btn { width: 100%; padding: 18px; background: var(--royal-gold); border: none; border-radius: 12px; font-weight: bold; color: black; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>دعوة زفاف</h1>
        <div class="names" id="displayNames">أحمد & سارة</div>
        <div class="details">
            📅 <span id="dateText">2026-06-25</span> <br> 
            📍 <span id="hallText">قاعة الفرح</span>
        </div>
        <a href="#" class="btn">📍 موقع القاعة (GPS)</a>
    </div>

    <div onclick="document.getElementById('adminPanel').style.display='block'" style="position:fixed; bottom:30px; right:30px; cursor:pointer; color:var(--royal-gold); font-size: 30px;">⚙️</div>

    <div id="adminPanel">
        <h2 style="color:var(--royal-gold)">تعديل البيانات</h2>
        <input type="text" id="nameInput" placeholder="أسماء العروسين">
        <input type="date" id="dateInput">
        <input type="text" id="hallInput" placeholder="اسم القاعة">
        <button class="save-btn" onclick="updateData()">حفظ التغييرات</button>
        <button onclick="document.getElementById('adminPanel').style.display='none'" style="width:100%; background:transparent; color:#ff4444; border:none; margin-top:20px; cursor:pointer;">إلغاء</button>
    </div>

    <script>
        function updateData() {
            const name = document.getElementById('nameInput').value;
            const date = document.getElementById('dateInput').value;
            const hall = document.getElementById('hallInput').value;
            if(name) document.getElementById('displayNames').innerText = name;
            if(date) document.getElementById('dateText').innerText = date;
            if(hall) document.getElementById('hallText').innerText = hall;
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
